---
# Automatic approval policy for workflow.yml changes.

default:
  allowed:
    # image tag
    - dag\.tag=.*
    # compute: general pools up to 16 vCPU
    - (dag|dag\.tasks\.[^.=]+)\.compute_profile=(None|general-(spot|on-demand)-(1vcpu-4gb|2vcpu-8gb|4vcpu-16gb|8vcpu-32gb|16vcpu-64gb))
    # Slack channel for alerts
    - notifications\.slack_channel=.*
    # outlets, at DAG and task level
    - (dag|dag\.tasks\.[^.=]+)\.outlets=.*
    # schedule: cron with a numeric minute (no */5 or * * * * *), presets, None, datasets, or intervals of 1 hour+
    - dag\.schedule=(None|@(hourly|daily|weekly|monthly|yearly)|[0-9][0-9,]* \S+ \S+ \S+ \S+)
    - dag\.schedule\.datasets=.*
    - dag\.schedule\.(hours|days|weeks)=(None|[1-9][0-9]*)
    # task dependencies
    - dag\.tasks\.[^.=]+\.dependencies=.*
    # env vars, at DAG and task level, unless the name contains PASSWORD/SECRET/TOKEN/API_KEY or starts with AIRFLOW_
    - (dag|dag\.tasks\.[^.=]+)\.env_vars=(None|\{\})
    - (dag|dag\.tasks\.[^.=]+)\.env_vars\.(?!(?i:[^=]*(PASSWORD|SECRET|TOKEN|API_KEY)|AIRFLOW_))[^=]+=.*

# Extra changes allowed in non-production environments (uncomment to enable)
# non_prod:
#   environments: [development, test, data-platform-test]
#   allowed:
#     - dag\.schedule(\.[^=]+)?=.* # any schedule, including */5
#     - dag\.(start_date|end_date)=(None|[0-9]{4}-[0-9]{2}-[0-9]{2})
#     - dag\.(catchup|is_paused_upon_creation)=(True|False|None)
#     - dag\.retries=(None|[0-5])
#     - dag\.retry_delay=(None|[0-9]+)
#     - dag\.max_active_runs=(None|[1-9]|10)
#     - dag\.params(\.[^=]+)?=.*
#     - dag\.inlets=.*
#     - dag\.tasks\.[^.=]+=(None|\{\}) # empty task added, or task removed
#     - dag\.tasks\.[^.=]+\.(inlets|skip_on_exit_code)=.*
#     - notifications(\.[^=]+)?=.* # emails, slack_events, slack_skipped_text

# Extra changes allowed in production (uncomment to enable)
# prod:
#   environments: [production]
#   allowed:
#     - dag\.retries=(None|[0-3])
#     - dag\.retry_delay=(None|[0-9]+)
#     - dag\.max_active_runs=(None|[1-5])
#     - dag\.is_paused_upon_creation=(True|False|None)
#     - dag\.params(\.[^=]+)?=.*

# Exceptions for a specific project or workflow (uncomment to enable)
# `match` is the workflow folder path: environments/<env>/<project>/<workflow>
# overrides:
#   - match: environments/development/analytical-platform/.* # GPU allowed for the platform team in dev
#     allowed:
#       - (dag|dag\.tasks\.[^.=]+)\.compute_profile=gpu-(spot|on-demand)-(1vcpu-4gb|2vcpu-8gb|4vcpu-16gb|8vcpu-32gb|16vcpu-64gb)
#   - match: environments/production/hmcts/.* # always review this project
