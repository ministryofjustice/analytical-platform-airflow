---
# Automatic approval policy for workflow.yml changes.

# WHO: this policy only applies to MAINTAINERS of the workflow being changed (the `maintainers` list in its
#      workflow.yml). A pull request from anyone else always needs a human review, even if every change below
#      is allowed. The maintainer check is done by the Automatic Approval Gate in workflow-validation.yml.
#
# WHAT: each changed field is checked as "field=new_value" (a removed field is None). A maintainer's pull request
#       is auto-approved only if EVERY changed field matches at least one rule below. Anything not listed needs a
#       human review.
# Use this for checking the regex - https://pythex.org/


# TEST LOCALLY: edit a workflow.yml, then from the repo root compare it with the version on main:
#   W=environments/<env>/<project>/<workflow>
#   git show main:"$W/workflow.yml" > /tmp/workflow-main.yml
#   python scripts/automatic_approval/main.py /tmp/workflow-main.yml "$W/workflow.yml"
# It prints the changed fields and any that need a human. Exit code 0 = auto-approve, 1 = needs a human.
# The local check does not include the maintainer check or the other CI checks.

default:
  allowed:
    # image tag (Docker tag characters only)
    - dag\.tag=[A-Za-z0-9_][A-Za-z0-9._-]{0,127}
    # compute: general pools up to 16 vCPU.
    - dag\.compute_profile=(None|general-(spot|on-demand)-(1vcpu-4gb|2vcpu-8gb|4vcpu-16gb|8vcpu-32gb|16vcpu-64gb))
    - dag\.tasks\.[^.=]+\.compute_profile=general-(spot|on-demand)-(1vcpu-4gb|2vcpu-8gb|4vcpu-16gb|8vcpu-32gb|16vcpu-64gb)
    # Slack channel name (letters, numbers, - and _ only), or removed
    - notifications\.slack_channel=(None|[A-Za-z0-9][A-Za-z0-9_-]{0,79})
    # outlets, at DAG and task level
    - (dag|dag\.tasks\.[^.=]+)\.outlets=.*
    # schedule: any type (cron, preset, None, datasets, intervals)
    - dag\.schedule(\.[^=]+)?=[^"\\\r\n]*
    # task dependencies
    - dag\.tasks\.[^.=]+\.dependencies=.*
    # env vars, at DAG and task level: name is letters, numbers and _ and does not contain SECRET;
    # value has no quotes, backslashes or newlines
    - (dag|dag\.tasks\.[^.=]+)\.env_vars=(None|\{\})
    - (dag|dag\.tasks\.[^.=]+)\.env_vars\.(?!(?i:[^=]*SECRET))[A-Za-z_][A-Za-z0-9_]*=[^"\\\r\n]*

# Extra changes allowed in non-production environments (uncomment to enable)
# non_prod:
#   environments: [development, test, data-platform-test]
#   allowed:
#     - dag\.(start_date|end_date)=(None|[0-9]{4}-[0-9]{2}-[0-9]{2})
#     - dag\.(catchup|is_paused_upon_creation)=(True|False|None)
#     - dag\.retries=(None|[0-5])
#     - dag\.retry_delay=(None|[0-9]+)
#     - dag\.max_active_runs=(None|[1-9]|10)
#     - dag\.params\.[A-Za-z_][A-Za-z0-9_]*=[^"\\\r\n]*
#     - dag\.inlets=.*
#     - dag\.tasks\.[^.=]+=(task|None) # task added or removed
#     - dag\.tasks\.[^.=]+\.(inlets|skip_on_exit_code)=.*
#     - notifications\.(emails|slack_events)=.*
#     - notifications\.slack_skipped_text=(None|[^\r\n]*)

# Extra changes allowed in production (uncomment to enable)
# prod:
#   environments: [production]
#   allowed:
#     - dag\.retries=(None|[0-3])
#     - dag\.retry_delay=(None|[0-9]+)
#     - dag\.max_active_runs=(None|[1-5])
#     - dag\.is_paused_upon_creation=(True|False|None)
#     - dag\.params\.[A-Za-z_][A-Za-z0-9_]*=[^"\\\r\n]*

# Exceptions for a specific project or workflow (uncomment to enable)
# `match` is the workflow folder path: environments/<env>/<project>/<workflow>
# overrides:
#   - match: environments/development/analytical-platform/.* # GPU allowed for the platform team in dev
#     allowed:
#       - (dag|dag\.tasks\.[^.=]+)\.compute_profile=gpu-(spot|on-demand)-(1vcpu-4gb|2vcpu-8gb|4vcpu-16gb|8vcpu-32gb|16vcpu-64gb)
#   - match: environments/production/hmcts/.* # always review this project
#     manual: true
