---
dag:
  repository: ministryofjustice/analytical-platform-airflow-cadet-deployer
  tag: 1.3.5
  compute_profile: general-on-demand-16vcpu-64gb
  catchup: false
  is_paused_upon_creation: true
  max_active_runs: 1
  retries: 0

  env_vars:
    DEPLOY_ENV: dev
    DBT_PROFILE_WORKGROUP: dbt-curated-dev
    DBT_PROJECT: mojap_derived_tables
    WORKFLOW_NAME: deploy-tribunals-et-dev
    BRANCH: tribs-curation3
    MODE: run
    THREAD_COUNT: 1

  tasks:
    build_wap:
      compute_profile: general-on-demand-16vcpu-64gb
      env_vars:
        MODE: run
        DBT_SELECT_CRITERIA: "+raw_et__et_englandwales_wap"

    validate_wap:
      compute_profile: general-on-demand-4vcpu-16gb
      env_vars:
        MODE: test
        DBT_SELECT_CRITERIA: raw_et__et_englandwales_wap
      dependencies: [build_wap]

    publish_raw:
      compute_profile: general-on-demand-4vcpu-16gb
      env_vars:
        MODE: run
        DBT_SELECT_CRITERIA: raw_et__et_englandwales
      dependencies: [validate_wap]

    build_expanded:
      compute_profile: general-on-demand-16vcpu-64gb
      env_vars:
        MODE: run
        DBT_SELECT_CRITERIA: "expanded_tribunals_raw__et_englandwales expanded_tribunals_raw__et_englandwales_iceberg"
      dependencies: [publish_raw]

    validate_expanded:
      compute_profile: general-on-demand-4vcpu-16gb
      env_vars:
        MODE: test
        DBT_SELECT_CRITERIA: "expanded_tribunals_raw__et_englandwales expanded_tribunals_raw__et_englandwales_iceberg"
      dependencies: [build_expanded]

maintainers:
  - AntonyJScott

secrets:
  - github-key

iam:
  athena: write
  glue: true
  s3_read_write:
    - mojap-derived-tables/dev/*

tags:
  business_unit: Central Digital
  owner: Antony.Scott@justice.gov.uk
