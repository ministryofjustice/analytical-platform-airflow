---
dag:
  repository: ministryofjustice/analytical-platform-airflow-cadet-deployer
  tag: 1.5.7
  compute_profile: general-on-demand-16vcpu-64gb
  catchup: false
  is_paused_upon_creation: true
  max_active_runs: 1
  retries: 0

  env_vars:
    DEPLOY_ENV: dev
    DBT_PROFILE_WORKGROUP: dbt-curated-dev
    DBT_PROJECT: mojap_derived_tables
    WORKFLOW_NAME: deploy-tribunals-et-dev
    BRANCH: feature/tribunals-dynamic-dev-generation
    MODE: run
    THREAD_COUNT: 1

  tasks:
    compile_et:
      compute_profile: general-on-demand-4vcpu-16gb
      env_vars:
        MODE: compile
        DBT_SELECT_CRITERIA: raw_et__et_englandwales_wap

maintainers:
  - AntonyJScott

secrets:
  - github-key

iam:
  athena: write
  glue: true
  s3_read_write:
    - mojap-derived-tables/dev/*

tags:
  business_unit: Central Digital
  owner: Antony.Scott@justice.gov.uk
