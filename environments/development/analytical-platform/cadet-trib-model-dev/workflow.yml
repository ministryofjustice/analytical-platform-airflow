dag:
  schedule:
    datasets:
      - s3://hmcts/datasets/dev/derived-tribunals/cadet/curated-et
      - s3://hmcts/datasets/dev/derived-tribunals/cadet/curated-sscs
  repository: ministryofjustice/analytical-platform-airflow-cadet-deployer
  tag: 1.5.12
  compute_profile: general-on-demand-16vcpu-64gb
  catchup: false
  is_paused_upon_creation: true
  max_active_runs: 1
  retries: 0
  env_vars:
    DEPLOY_ENV: dev
    DBT_PROFILE_WORKGROUP: dbt-curated-dev
    DBT_PROJECT: mojap_derived_tables
    WORKFLOW_NAME: deploy-derived-tribunals-modelling-dev
    BRANCH: feature/tribunals-staging-datamart-templates
    MODE: build
    THREAD_COUNT: 4
  tasks:
    build_et:
      compute_profile: general-on-demand-4vcpu-16gb
      env_vars:
        MODE: build
        DBT_SELECT_CRITERIA: path:models/staging/stg_employment_tribunals path:models/tribunals/employment_tribunals_datamarts
    build_sscs:
      compute_profile: general-on-demand-4vcpu-16gb
      env_vars:
        MODE: build
        DBT_SELECT_CRITERIA: path:models/staging/stg_sscs path:models/tribunals/social_security_and_child_support_datamarts
maintainers:
  - AntonyJScott
tags:
  business_unit: Central Digital
  owner: Antony.Scott@justice.gov.uk
iam:
  athena: write
  glue: true
  s3_read_write:
    - mojap-derived-tables/dev/*
secrets:
  - github-key
