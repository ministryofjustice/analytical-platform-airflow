---
dag:
  repository: moj-analytical-services/airflow-cf-misconduct
  tag: dev-1
  catchup: false
  max_active_runs: 1
  tasks:
    check-for-new-extract:
      env_vars:
        EXEC_SCRIPT: "python"
        EXEC_ARGS: "scripts/check_new_extract.py --env dev"
      skip_on_exit_code:
        - 99
    classify:
      dependencies: [check-for-new-extract]
      env_vars:
        EXEC_SCRIPT: "classification-predict-inv"
        EXEC_ARGS: "--env dev --source sql"
      compute_profile: gpu-spot-8vcpu-32gb
    athena-to-webapp:
      dependencies: [classify]
      env_vars:
        EXEC_SCRIPT: "python"
        EXEC_ARGS: "scripts/athena_to_webapp.py --env dev"

iam:
  athena: write
  s3_read_write:
    - alpha-cf-misconduct/*
    - alpha-app-fraud-and-corruption-insights/*
    - mojap-athena-query-dump/*
    - alpha-athena-query-dump/*
  s3_read_only:
    - mojap-derived-tables/prod/models/domain_name=people/database_name=counter_fraud_misconduct*
    - mojap-derived-tables/dev/models/domain_name=people/database_name=counter_fraud_misconduct*

maintainers:
  - jhenfrancis
  - sheilz81
  - adityadsgit

notifications:
  slack_channel: cf-misconduct-notifications-dev

tags:
  business_unit: HQ
  owner: sheila.ladva@justice.gov.uk
