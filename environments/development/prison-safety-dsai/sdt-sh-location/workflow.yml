  env_vars:
    AIRFLOW_ENVIRONMENT: "DEVELOPMENT"
  tasks:
    task:
      compute_profile: "general-spot-8vcpu-32gb"
      outlets:
        - "s3://alpha-safety-mi/prisons_ds/dev_selfharm_proc/"

