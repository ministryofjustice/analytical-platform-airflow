dag:
  repository: moj-analytical-services/airflow-shs-qual
  tag: v1.6.6
  compute_profile: "general-spot-4vcpu-16gb"
  schedule:
    datasets:
      - "s3://alpha-safety-mi/prisons_ds/dev_selfharm_proc/"
  env_vars:
    AIRFLOW_ENVIRONMENT: "DEVELOPMENT" #to be changed to dev once we have a prod DAG running
  inlets:
    - "s3://alpha-safety-mi/prisons_ds/dev_selfharm_proc/"
  outlets:
    - "s3://alpha-app-safety-diagnostic-tool/development/txt_sh_pop.feather"

iam:
  athena: write
  lake_formation: true

  s3_read_only:
    - alpha-safety-mi/prisons_ds/*

  s3_read_write:
    - alpha-app-safety-diagnostic-tool/*

notifications:
  emails:
    - sdt-support@justice.gov.uk

maintainers:
  - miller-william
  - lauratraceymoj

tags:
  business_unit: HMPPS
  owner: laura.tracey@justice.gov.uk
