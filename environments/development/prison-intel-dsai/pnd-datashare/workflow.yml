dag:
  repository: moj-analytical-services/airflow-pdsai-pnd-datashare
  tag: 0.3.0
  catchup: false
  depends_on_past: false
  is_paused_upon_creation: false
  max_active_runs: 1
  retries: 3
  retry_delay: 100
  schedule: "0 8 1-7 * 1"
  start_date: "2025-10-23"
  tasks:
    task:
      compute_profile: "general-on-demand-1vcpu-4gb"

iam:
  athena: write
  lake_formation: true
  s3_read_write:
    - alpha-app-bentham-app/*
    - alpha-athena-dump/*
    - alpha-athena-query-dump/*

secrets:
  - egress-user
  - egress-pass
  - gpg-key-pass
  - fingerprint

notifications:
  emails:
    - matthew.funnell@justice.gov.uk
  slack_channel: intel-app-maintenance

maintainers:
  - MattFunnell

tags:
  business_unit: HMPPS
  owner: matthew.funnell@justice.gov.uk
