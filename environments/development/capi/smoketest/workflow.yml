dag:
  repository: moj-analytical-services/bold_rr_pilot_families_llm_info_extraction
  tag: je-test-v1.0.16-dev
  env_vars:
    # Keep the existing development environment and AWS region.
    ENV_FOR_DYNACONF: dev
    AWS_DEFAULT_REGION: eu-west-1

    # Use distinct names for this test's outputs.
    DYNACONF_DATASET: 2324_je_20261109_01
    DYNACONF_RUN_VERSION: je_test_20261109_01
    DYNACONF_ADDRESS_AUDIT_TABLE: address_detection_audit_2324_je_20261109_01

    # Keep the smoke test limited to 20 people.
    DYNACONF_SAMPLE_FROM_COHORT: "true"
    DYNACONF_LIMIT_ROWS: "true"
    DYNACONF_LIMIT: "20"
    DYNACONF_ADDRESS_AUDIT_ENABLED: "true"

    # Give this test its own baseline master rather than deleting the shared one.
    DYNACONF_ADDRESS_BASELINE_MASTER_TABLE: address_baseline_master_je_20261109_01

    AIRFLOW_CTX_DAG_ID: "{{ dag.dag_id }}"
    AIRFLOW_CTX_TASK_ID: "{{ ti.task_id }}"
    AIRFLOW_CTX_TRY_NUMBER: "{{ ti.try_number }}"
    AIRFLOW_CTX_MAP_INDEX: "{{ ti.map_index }}"

  tasks:
    prepare:
      env_vars:
        PROCESS_TYPE: prepare
    bcst:
      dependencies: [prepare]
      env_vars:
        PROCESS_TYPE: bcst
    layerthree:
      dependencies: [prepare]
      env_vars:
        PROCESS_TYPE: layerthree
    nomis:
      dependencies: [prepare]
      env_vars:
        PROCESS_TYPE: nomis
    delius_batch:
      dependencies: [prepare]
      env_vars:
        PROCESS_TYPE: delius_batch
    postprocess:
      dependencies: [bcst, layerthree, nomis, delius_batch]
      env_vars:
        PROCESS_TYPE: postprocess

iam:
  athena: write
  glue: true
  bedrock: true
  s3_read_write:
    - alpha-bold-pilot-rr-families/*
  s3_read_only:
    - mojap-derived-tables/*
    - alpha-data-linking/*

notifications:
  emails:
    - guy.wheeler@justice.gov.uk

maintainers:
  - guyvw1

tags:
  business_unit: HQ
  owner: guy.wheeler@justice.gov.uk
