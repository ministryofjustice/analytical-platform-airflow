dag:
  repository: ministryofjustice/coat-copilot-usage-pipeline
  tag: v1.0.4
  catchup: false
  is_paused_upon_creation: false
  max_active_runs: 1
  retries: 1
  retry_delay: 150
  start_date: "2026-07-01"
  schedule: "0 9,15 * * *"
  tasks:
    extract:
      compute_profile: "general-spot-1vcpu-4gb"
      skip_on_exit_code:
        - 99
      env_vars:
        MODE: "dev"
        DEV_BUCKET: "cloud-platform-c7bd5f7843c58dde69caa00cb7509154"

iam:
  s3_read_write:
    - cloud-platform-c7bd5f7843c58dde69caa00cb7509154/*

secrets:
  - enterprise-billing-token

maintainers:
  - mamonu
  - levgorbunov1

tags:
  business_unit: Platforms
  owner: anthony.bishop@justice.gov.uk

notifications:
  slack_channel: coat-notifications
  slack_events:
    - failure
    - success
    - skipped
  slack_skipped_text: "GitHub Copilot users-1-day report was not ready yet (upstream processing delay). The next scheduled run will retry."
