---
dag:
  repository: moj-analytical-services/laa-provider-details-etl
  tag: 3.0.0-alpha
  retries: 1
  retry_delay: 150
  env_vars:
    ENVIRONMENT: "dev"
    LOG_LEVEL: "INFO"
    LOAD_MODE: "athena_iceberg"
    PIPELINE_AWS_REGION: "eu-west-2"
    ATHENA_WORK_GROUP: "laa"
    DATABASE_NAME: "pda-raw"
    CACHE_ENABLED: "false"
    CACHE_BACKEND: "none"
    ERROR_SUMMARY_BACKEND: "log"
    DISABLE_COMPRESSION: "true"
    DLTHUB_TELEMETRY: "false"
    API_REQUEST_TIMEOUT: "30"
    API_MAX_RETRIES: "2"
    DEPENDENCY_BATCH_SIZE: "100"
    API_BASE_URL: >-
      https://laa-provider-details-api-uat.apps.live.cloud-platform.service.justice.gov.uk/

  tasks:
    extract-procurement-areas:
      env_vars:
        PIPELINE_NAME: "pda_raw_athena_iceberg"
        API_ENDPOINTS: "procurement_areas"

    extract-access-points:
      env_vars:
        PIPELINE_NAME: "pda_raw_athena_iceberg"
        API_ENDPOINTS: "access_points"

    extract-provider-office-details:
      env_vars:
        PIPELINE_NAME: "pda_raw_athena_iceberg"
        API_ENDPOINTS: "provider_office_details"
        DEPENDENCY_MODE: "athena"
        ATHENA_SOURCE_WORKGROUP: "laa"
        ATHENA_SOURCE_DATABASE: "data-claims"
        ATHENA_SOURCE_TABLE: "submission"
        ATHENA_SOURCE_COLUMNS: "officeCode=office_account_number"

iam:
  external_role: arn:aws:iam::766696030771:role/airflow_pda

secrets:
  - api-token

notifications:
  emails:
    - Damilola.Oyebade@justice.gov.uk
  slack_channel: laa-de-alerts

maintainers:
  - dami-moj

tags:
  business_unit: LAA
  owner: LAA-Data-Engineering@justice.gov.uk
