dag:
  repository: moj-analytical-services/airflow-opg-etl
  tag: v3.8.5-test-2
  catchup: false
  depends_on_past: false
  is_paused_upon_creation: false
  max_active_runs: 1
  retries: 0
  retry_delay: 150
  start_date: "2026-10-20"
  schedule: None
  env_vars:
    DATABASE: "opg130"
    PIPELINE_NAME: "opg130"
    DATABASE_VERSION: "dev"
    GITHUB_TAG: "v3.8.5-test-1"
    ATHENA_DB_PREFIX: "opg"
    START_DATE: "2026-10-20"
    AWS_DEFAULT_REGION: "eu-west-1"
    AWS_METADATA_SERVICE_TIMEOUT: "60"
    AWS_METADATA_SERVICE_NUM_ATTEMPTS: "5"
  tasks:
    to_land:
      env_vars:
        STEP: "land"
      compute_profile: "general-on-demand-1vcpu-4gb"
    land_to_raw_hist:
      env_vars:
        STEP: "raw_hist"
      compute_profile: "general-on-demand-1vcpu-4gb"
      dependencies: [to_land]
    raw_hist_to_processed:
      env_vars:
        STEP: "processed"
      compute_profile: "general-on-demand-1vcpu-4gb"
      dependencies: [land_to_raw_hist]
    processed_to_curated:
      env_vars:
        STEP: "curated"
      compute_profile: "general-on-demand-1vcpu-4gb"
      dependencies: [raw_hist_to_processed]
    create_curated_database:
      env_vars:
        STEP: "curated_database"
      compute_profile: "general-on-demand-1vcpu-4gb"
      dependencies: [processed_to_curated]
iam:
  athena: write
  glue: true
  s3_read_write:
    - mojap-land/opg/dev/opg130/*
    - mojap-raw-hist/opg/dev/opg130/*
    - mojap-processed/opg/dev/opg130/*
    - alpha-opg-etl/dev/opg130/*
    - mojap-athena-query-dump/*airflow-development-opg-opg130/*

  s3_read_only:
    - s3://mojap-land-dev/opg/dev/opg130/*

maintainers:
  - p-sin

tags:
  business_unit: OPG
  owner: philip.sinfield@justice.gov.uk

notifications:
  emails:
    - philip.sinfield@justice.gov.uk
  slack_channel: opg-deds
