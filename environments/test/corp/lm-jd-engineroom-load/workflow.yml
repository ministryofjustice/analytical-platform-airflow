---
dag:
  repository: ministryofjustice/jd-engine-room-local-mapping-pipeline
  tag: v1.2.1
  catchup: false
  compute_profile: general-on-demand-2vcpu-8gb
  max_active_runs: 1
  retries: 1
  env_vars:
    AWS_DEFAULT_REGION: "eu-west-1"
    AWS_ATHENA_QUERY_EXTRACT_REGION: "eu-west-1"
  tasks:
    hmcts_lm:
      env_vars:
        BUSINESS_UNIT: "hmcts"
        OVERRIDE_SCHEDULE: "true"
        ENVIRONMENT: "dev"
        EVOLVE_SCHEMA: "true"
        FORCE_FY: "{{ dag_run.conf.get('force_fy', '') }}"
        FORCE_PERIOD: "{{ dag_run.conf.get('force_period', '') }}"
    hmpps_lm:
      env_vars:
        BUSINESS_UNIT: "hmpps"
        OVERRIDE_SCHEDULE: "true"
        ENVIRONMENT: "dev"
        EVOLVE_SCHEMA: "true"
        FORCE_FY: "{{ dag_run.conf.get('force_fy', '') }}"
        FORCE_PERIOD: "{{ dag_run.conf.get('force_period', '') }}"
    mojhq_lm:
      env_vars:
        BUSINESS_UNIT: "moj_hq"
        OVERRIDE_SCHEDULE: "true"
        ENVIRONMENT: "dev"
        EVOLVE_SCHEMA: "true"
        FORCE_FY: "{{ dag_run.conf.get('force_fy', '') }}"
        FORCE_PERIOD: "{{ dag_run.conf.get('force_period', '') }}"

iam:
  athena: write
  glue: true
  s3_read_write:
    - mojap-land-dev/corporate/local_mappings/*

secrets:
  - azure-client-id
  - azure-tenant-id
  - azure-client-secret

maintainers:
  - Csheldon155
  - PQjustice

tags:
  business_unit: Central Digital
  owner: Chris.Sheldon@justice.gov.uk
