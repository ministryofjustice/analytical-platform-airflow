---
dag:
  repository: moj-analytical-services/airflow-cf-misconduct
  tag: v14
  catchup: false
  max_active_runs: 1
  schedule:
    datasets:
      - "s3://mojap-derived-tables/prod/deploy-corporate-epm/"
  tasks:
    closed-resignations-dismissals:
      inlets:
        - "s3://mojap-derived-tables/prod/deploy-corporate-epm/"
      env_vars:
        EXEC_SCRIPT: "python"
        EXEC_ARGS: "scripts/generate_report_closed_resignations_dismissals.py --env prod"
      compute_profile: general-on-demand-1vcpu-4gb
      skip_on_exit_code:
        - 99
    ccu-monthly-report:
      inlets:
        - "s3://mojap-derived-tables/prod/deploy-corporate-epm/"
      env_vars:
        EXEC_SCRIPT: "python"
        EXEC_ARGS: "scripts/generate_report_ccu.py --env prod"
      compute_profile: general-on-demand-1vcpu-4gb
      skip_on_exit_code:
        - 99

iam:
  athena: write
  s3_read_write:
    - alpha-cf-misconduct/*
    - alpha-app-fraud-and-corruption-insights/*
    - mojap-athena-query-dump/*
    - alpha-athena-query-dump/*
  s3_read_only:
    - mojap-derived-tables/prod/models/domain_name=people/database_name=counter_fraud_misconduct*
    - mojap-derived-tables/dev/models/domain_name=people/database_name=counter_fraud_misconduct*

maintainers:
  - sheilz81
  - adityadsgit

notifications:
  emails:
    - sheila.ladva@justice.gov.uk
    - aditya.upmanyu@justice.gov.uk
  slack_channel: cf-misconduct-notifications

tags:
  business_unit: HQ
  owner: sheila.ladva@justice.gov.uk
