---
dag:
  repository: ministryofjustice/analytical-platform-airflow-cadet-deployer
  tag: 1.5.12
  compute_profile: general-on-demand-8vcpu-32gb
  schedule: "0 2 * * *"
  start_date: "2026-08-17"
  catchup: false
  env_vars:
    DEPLOY_ENV: prod
    DBT_PROJECT: hmpps_digital_prisons_reporting_tables
    S3_BUCKET: dpr-structured-historical-production
    WORKFLOW_NAME: deploy-digital-prisons-reporting-prod
    DBT_PROFILE_WORKGROUP: primary
    DBT_SELECT_CRITERIA: "tag:dpr-daily"
    MODE: build
    AWS_DEFAULT_REGION: eu-west-2
    DBT_PROFILE: dpr
    ENFORCE_LAKE_FORMATION: true
    RUN_SOURCE_FRESHNESS: true
    RUN_UNIT_TESTS: false
    FULL_REFRESH: false
    CHECK_DUAL_MATERIALIZATION: true
    DEPLOY_MODIFIED_SEEDS: true
  tasks:
    table_deploy:
      compute_profile: general-on-demand-8vcpu-32gb
      outlets:
        - "s3://hmpps-digital-prisons-reporting-tables/prod/dpr-daily/"
    check_run_results:
      compute_profile: general-on-demand-1vcpu-4gb
      env_vars:
        IS_DATASET_CHECK: true
      dependencies: [table_deploy]
secrets:
  - github-key

maintainers:
  - andrewc-moj
  - AntFMoJ

notifications:
  emails:
    - andrew.craik@justice.gov.uk
    - anthony.fitzroy@justice.gov.uk
    - anthony.cody@justice.gov.uk
  slack_channel: hmpps-data-notifications
  slack_events:
    - failure

iam:
  external_role: arn:aws:iam::004723187462:role/dpr-data-api-cross-account-role

tags:
  business_unit: HMPPS
  owner: anthony.fitzroy@justice.gov.uk
