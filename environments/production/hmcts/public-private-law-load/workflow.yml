---
dag:
  repository: moj-analytical-services/moj-data-loader
  tag: v2.1.1
  start_date: "2026-09-23"
  schedule: 30 3 * * *
  is_paused_upon_creation: true
  env_vars:
    MODAL_ENV: "prod"
    MODAL_ALLOW_PROD: "true"
    MODAL_SCHEMA_CONTRACT: "evolve"
    MODAL_LOAD_LIMIT: "100"
    AWS_DEFAULT_REGION: "eu-west-1"
    AWS_ATHENA_QUERY_EXTRACT_REGION: "eu-west-1"
    AWS_DEFAULT_EXTRACT_REGION: "eu-west-1"
  max_active_runs: 1
  retries: 0
  compute_profile: general-on-demand-2vcpu-8gb
  tasks:
    ccd_load_privatelaw_privatelaw_exceptionrecord:
      env_vars:
        MODAL_PIPELINE_NAME: "public_private_law/privatelaw_privatelaw_exceptionrecord"
    ccd_load_privatelaw_prlapps:
      env_vars:
        MODAL_PIPELINE_NAME: "public_private_law/privatelaw_prlapps"
    ccd_load_publiclaw_care_supervision_epo:
      env_vars:
        MODAL_PIPELINE_NAME: "public_private_law/publiclaw_care_supervision_epo"
      compute_profile: general-spot-32vcpu-128gb
    ccd_load_publiclaw_publiclaw_exceptionrecord:
      env_vars:
        MODAL_PIPELINE_NAME: "public_private_law/publiclaw_publiclaw_exceptionrecord"

iam:
  athena: write
  glue: true

  s3_read_only:
    - mojap-land/hmcts/ccd-public-private-law/*

  s3_read_write:
    - mojap-processed/domain__hmcts/env__prod/*

notifications:
  slack_channel: dmet-hmcts-notifications

maintainers:
  - DanJ-MOJ
  - Andy-Cook
  - AntonyJScott

tags:
  business_unit: Central Digital
  owner: cft_data_engineering@justice.gov.uk
