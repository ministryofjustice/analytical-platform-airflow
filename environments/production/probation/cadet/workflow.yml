dag:
  repository: ministryofjustice/analytical-platform-airflow-cadet-deployer
  tag: 1.3.9
  schedule: "0 3 * * *"
  start_date: "2026-02-23"
  catchup: false
  env_vars:
    DEPLOY_ENV: prod
    DBT_PROJECT: hmpps_probation_data_tables
    S3_BUCKET: probation-datalake-prod-20260112145345979100000002
    WORKFLOW_NAME: deploy-probation-data-tables
    DBT_PROFILE_WORKGROUP: dbt-probation-prod
    DBT_SELECT_CRITERIA: tag:ppud tag:ppud_derived
    MODE: build
    AWS_DEFAULT_REGION: eu-west-2
    DBT_PROFILE: probation

  tasks:
    table_deploy:
      compute_profile: general-on-demand-8vcpu-32gb
    check_run_results:
      compute_profile: general-on-demand-1vcpu-4gb
      env_vars:
        IS_DATASET_CHECK: true
      dependencies: [table_deploy]
      outlets:
        - "s3://probation-datalake-prod-20260112145345979100000002/data/prod"

secrets:
  - github-key

maintainers:
  - lalithanagarur
  - joephillipsjustice

notifications:
  emails:
    - lalitha.nagarur3@justice.gov.uk
    - joseph.phillips@justice.gov.uk
    - ProbationDataEngineering@justice.gov.uk
  slack_channel: de-probation-airflow-prod

iam:
  external_role: arn:aws:iam::189157455002:role/probation-cadet-prod

tags:
  business_unit: HMPPS
  owner: ProbationDataEngineering@justice.gov.uk
