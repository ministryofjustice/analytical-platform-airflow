dag:
  repository: ministryofjustice/analytical-platform-airflow-cadet-deployer
  tag: 1.5.2
  start_date: "2026-09-29"
  catchup: false
  env_vars:
    DEPLOY_ENV: prod
    DBT_PROJECT: hmpps_probation_data_tables
    S3_BUCKET: dpr-structured-historical-production
    WORKFLOW_NAME: deploy-derived-probation-data-tables
    DBT_PROFILE_WORKGROUP: primary
    MODE: build
    AWS_DEFAULT_REGION: eu-west-2
    DBT_PROFILE: dpr

  tasks:
    curated_table_deploy:
      compute_profile: general-on-demand-8vcpu-32gb
      env_vars:
        DBT_SELECT_CRITERIA: tag:ppud

    curated_check_run_results:
      compute_profile: general-on-demand-1vcpu-4gb
      env_vars:
        IS_DATASET_CHECK: true
      dependencies: [curated_table_deploy]
      outlets:
        - "s3://dpr-structured-historical-production/data/prod/curated"

    derived_table_deploy:
      compute_profile: general-on-demand-8vcpu-32gb
      env_vars:
        DBT_SELECT_CRITERIA: tag:ppud_derived
      dependencies: [curated_check_run_results]

    derived_check_run_results:
      compute_profile: general-on-demand-1vcpu-4gb
      env_vars:
        IS_DATASET_CHECK: true
      dependencies: [derived_table_deploy]
      outlets:
        - "s3://dpr-structured-historical-production/data/prod/derived"

secrets:
  - github-key

maintainers:
  - lalithanagarur
  - joephillipsjustice

notifications:
  emails:
    - lalitha.nagarur3@justice.gov.uk
    - joseph.phillips@justice.gov.uk
    - ProbationDataEngineering@justice.gov.uk
  slack_channel: de-probation-airflow-prod

iam:
  external_role: arn:aws:iam::004723187462:role/dpr-data-api-cross-account-role

tags:
  business_unit: HMPPS
  owner: ProbationDataEngineering@justice.gov.uk
