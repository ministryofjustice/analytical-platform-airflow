    ENDPOINT: "DATA_LAKE_PROD"
    AZURE_TABLE: "workspace"
    FILENAME_COL_NAME: "meta__source_file"
    LAND_BUCKET: "mojap-land-dev"
    COPY_MODE: "all"
    WRITE_FOLDER_STRUCTURE: "file_only"
    EXCLUDED_FILES_REGEXPR: "(?i)^(?!.*[.]parquet$)"

