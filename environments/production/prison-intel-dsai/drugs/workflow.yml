dag:
  repository: moj-analytical-services/airflow-drugs-app
  tag: 1.2.3
  env_vars:
    AIRFLOW_ENVIRONMENT: "PRODUCTION"
  catchup: false
  depends_on_past: false
  is_paused_upon_creation: false
  max_active_runs: 1
  retries: 3
  retry_delay: 100
  schedule:
    datasets:
      - "s3://mojap-derived-tables/prod/drugs_app"
  start_date: "2025-04-04"
  tasks:
    task:
      compute_profile: "general-on-demand-1vcpu-4gb"

iam:
  athena: read
  lake_formation: true
  s3_read_only:
    - alpha-app-kpi-s3-proxy/*
  s3_read_write:
    - alpha-app-drugs-app/
    - alpha-app-drug-conveyancing/*
    - alpha-athena-dump/*
    - alpha-athena-query-dump/*

notifications:
  emails:
    - matthew.funnell@justice.gov.uk
  slack_channel: intel-app-maintenance

maintainers:
  - MattFunnell
  - d-lundie

tags:
  business_unit: HMPPS
  owner: matthew.funnell@justice.gov.uk
