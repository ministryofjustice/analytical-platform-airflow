---
dag:
  repository: moj-analytical-services/airflow-file
  tag: v1.5.2
  schedule: "45 */6 * * *"
  is_paused_upon_creation: true
  env_vars:
    AFFILE_ALLOW_PROD: "true"
    AFFILE_ENV: "prod"
    AFFILE_SCHEMA_CONTRACT: "freeze"
    AWS_DEFAULT_REGION: "eu-west-1"
    AWS_ATHENA_QUERY_EXTRACT_REGION: "eu-west-1"
    AWS_DEFAULT_EXTRACT_REGION: "eu-west-1"
  catchup: false
  max_active_runs: 1
  retries: 2
  compute_profile: general-on-demand-2vcpu-8gb
  tasks:
    load-fieldglass__all_work_orders:
      env_vars:
        AFFILE_PIPELINE_NAME: "fieldglass__all_work_orders"
    load-sop__fieldglass__rolling_prev_month_timesheets:
      env_vars:
        AFFILE_PIPELINE_NAME: "fieldglass__rolling_prev_month_timesheets"

iam:
  athena: write
  glue: true

  s3_read_only:
    - mojap-land/corporate/report_extractor_prod/fieldglass/*
    - mojap-land-preprod/corporate/report_extractor/fieldglass/*

  s3_read_write:
    - mojap-processed/domain__hr/env__prod/corporate_fieldglass/*
    - mojap-processed/domain__hr/env__prod/corporate_fieldglass_staging/*
    - mojap-processed/domain__hr/env__prod/athena_query_dump/*
    - mojap-processed/corporate/sop/prod/*

notifications:
  slack_channel: dmet-corp-notifications

  emails:
    - Laurence.Droy@justice.gov.uk
    - Benjamin.Finucane@justice.gov.uk

maintainers:
  - ltd-pa
  - benjamin-finucane

tags:
  business_unit: Central Digital
  owner: Laurence.Droy@justice.gov.uk
